databases:
  - name: shadowkeys-db
    plan: free
services:
  - type: web
    name: shadowkeys
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: shadowkeys-db, property: connectionString}
      - key: ADMIN_PASSWORD
        sync: false
